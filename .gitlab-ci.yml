stages:
  - test
  - deploy

# Same gate as the GitHub pipeline: nothing reaches the droplet until the
# payout and wallet-concurrency tests have passed.
test_backend:
  stage: test
  image: python:3.13
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_DB: lab_expertgg
    POSTGRES_USER: lab_expertgg
    POSTGRES_PASSWORD: devpassword
    SECRET_KEY: ci-secret-not-used-anywhere-else
    # See the GitHub workflow: without this the test client gets 301s.
    FORCE_HTTPS: 'False'
    DB_HOST: postgres
    DB_NAME: lab_expertgg
    DB_USER: lab_expertgg
    DB_PASSWORD: devpassword
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml
  before_script:
    - cd backend
    - pip install -q -r requirements.txt
  script:
    - python manage.py test --verbosity 2

deploy_backend:
  stage: deploy
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - backend/**/*
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh root@$DEPLOY_HOST "cd /root/lab-expertgg && git fetch origin main && git reset --hard origin/main && cd backend && source venv/bin/activate && pip install -q -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput && systemctl restart expertgg && systemctl is-active expertgg"
